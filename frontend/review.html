<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovAI - Review entities</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2933; }
      main { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
      h1 { margin: 0 0 4px; font-size: 24px; }
      h2 { margin: 28px 0 10px; font-size: 18px; }
      .muted { color: #6d7885; font-size: 14px; }
      .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
      select, input, textarea, button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #ccd3db; background: #fff; }
      textarea { width: 100%; box-sizing: border-box; min-height: 60px; }
      button { cursor: pointer; }
      button.primary { background: #4b3fd6; border-color: #4b3fd6; color: #fff; }
      .card { background: #fff; border: 1px solid #e3e7ec; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
      .card.needs_review { border-left: 4px solid #e8a317; }
      .card.stale, .card.merged { opacity: 0.6; }
      .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
      .name { font-weight: 600; font-size: 16px; }
      .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eceafd; color: #4b3fd6; }
      .chip.warn { background: #fdf0d5; color: #8a5a00; }
      .chip.ok { background: #dcf5e6; color: #1a6b3a; }
      .chip.grey { background: #eceff3; color: #52606d; }
      .note { color: #8a5a00; font-size: 14px; margin-top: 6px; }
      .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
      .error { background: #fde8e8; color: #9b1c1c; padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
      .form { display: grid; gap: 8px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Review entities</h1>
      <p class="muted">Characters, locations and objects found in the story. Items that need a look are marked. Edits and approvals are kept when the story is analysed again.</p>
      <div class="bar">
        <label>Series <select id="series"></select></label>
        <label><input type="checkbox" id="onlyReview" /> Needs review only</label>
        <button id="refresh">Refresh</button>
      </div>
      <div id="error" class="error" hidden></div>
      <div id="content"></div>
    </main>
    <script src="/ui/review.js"></script>
  </body>
</html>
